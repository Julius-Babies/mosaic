name: build

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches:
      - 'trunk'
    tags-ignore:
      - '**'

env:
  GRADLE_OPTS: "-Dkotlin.incremental=false -Dorg.gradle.logging.stacktrace=full"

jobs:
  tty-test-binaries:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version

      - run: ./gradlew :mosaic-tty:linkNativeDebugTests

      - uses: actions/upload-artifact@v7
        with:
          name: mosaic-tty-native-tests
          path: mosaic-tty/build/bin
          if-no-files-found: error

  tty-tests:
    needs:
      - tty-test-binaries
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-14
            target: macosArm64
          - os: macos-15
            target: macosArm64
          - os: macos-26
            target: macosArm64
          - os: ubuntu-22.04
            target: linuxX64
          - os: ubuntu-22.04-arm
            target: linuxArm64
          - os: ubuntu-24.04
            target: linuxX64
          - os: ubuntu-24.04-arm
            target: linuxArm64
          - os: ubuntu-26.04
            target: linuxX64
          - os: ubuntu-26.04-arm
            target: linuxArm64
          - os: windows-2022
            target: mingwX64
          - os: windows-2025
            target: mingwX64

    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 5

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mosaic-tty-native-tests

      - name: Set executable bit
        if: ${{ !startsWith(matrix.platform.os, 'windows-') }}
        run: chmod +x ${{ matrix.platform.target }}/debugTest/test.*

      - run: ${{ matrix.platform.target }}/debugTest/test.*
        shell: bash

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version
      - uses: gradle/actions/setup-gradle@v6

      # Assemble everything and run API checks without executing the
      # per-platform tests (the cross-compiled ones cannot run on the host).
      - run: >
          ./gradlew
          --continue
          build
          -x allTests
          -x linuxX64Test
          -x macosArm64Test
          -x mingwX64Test

      # mosaic-tty native tests run in the matrix job above; run the macOS host
      # tests for the remaining modules here to get some test coverage.
      - run: >
          ./gradlew
          --continue
          macosArm64Test
          -x :mosaic-tty:macosArm64Test

  final-status:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    needs:
      - tty-tests
      - build
    steps:
      - name: Check
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if ! grep -q -v -E '(failure|cancelled)' <<< "$results"; then
            echo "One or more required jobs failed"
            exit 1
          fi
