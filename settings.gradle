plugins {
	id 'com.gradle.develocity' version '4.5.0'
}

develocity {
	buildScan {
		termsOfUseUrl = 'https://gradle.com/help/legal-terms-of-use'
		if (System.getenv('CI') == 'true') {
			termsOfUseAgree = 'yes'
			tag 'CI'
		} else {
			publishing.onlyIf { false }
		}
	}
}

rootProject.name = 'mosaic-fork'

include ':mosaic-animation'
include ':mosaic-runtime'
include ':mosaic-terminal'
include ':mosaic-testing'
include ':mosaic-tty'
include ':mosaic-tty-terminal'

// Samples are intentionally excluded from the build. This fork only exists to
// publish the library modules; the upstream samples are kept for reference but
// are not part of the build.

include ':tools:raw-mode-echo'

enableFeaturePreview('TYPESAFE_PROJECT_ACCESSORS')
